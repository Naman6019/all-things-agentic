runConfig:
  # Warm for the hackathon judging window -- a cold start on the first hit
  # costs several seconds. Set back to 0 after judging to stop paying for an
  # idle instance.
  minInstances: 1
  maxInstances: 3
  concurrency: 40
  cpu: 1
  memoryMiB: 512

env:
  # Public preview: an empty allowlist lets any registered account in, each
  # scoped to its own Firestore namespace by uid. Declared here rather than
  # left unset so a stale value cannot linger on the Cloud Run service --
  # a single owner address was doing exactly that and 403'd everyone else.
  - variable: AUTHORIZED_EMAILS
    value: ""
    availability:
      - RUNTIME
  - variable: TALENTOS_API_URL
    value: https://career-agent-275295803705.us-central1.run.app
    availability:
      - RUNTIME
  - variable: CAREER_AGENT_API_URL
    value: https://career-agent-275295803705.us-central1.run.app
    availability:
      - RUNTIME
