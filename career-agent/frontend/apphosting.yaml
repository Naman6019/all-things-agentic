runConfig:
  # Warm for the hackathon judging window -- a cold start on the first hit
  # costs several seconds. Set back to 0 after judging to stop paying for an
  # idle instance.
  minInstances: 1
  maxInstances: 3
  concurrency: 40
  cpu: 1
  memoryMiB: 512

# AUTHORIZED_EMAILS is deliberately absent. auth-server.ts reads an empty
# value as public-preview mode, and App Hosting rejects an env entry with an
# empty value, so the only way to express "no allowlist" is to declare
# nothing. It had been set to a single owner address directly on the Cloud
# Run service, which 403'd every other account; that value has been removed.
env:
  - variable: TALENTOS_API_URL
    value: https://career-agent-275295803705.us-central1.run.app
    availability:
      - RUNTIME
  - variable: CAREER_AGENT_API_URL
    value: https://career-agent-275295803705.us-central1.run.app
    availability:
      - RUNTIME
