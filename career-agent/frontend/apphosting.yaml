runConfig:
  minInstances: 0
  maxInstances: 3
  concurrency: 40
  cpu: 1
  memoryMiB: 512

env:
  - variable: TALENTOS_API_URL
    value: https://talentos-iqf6u4g5bq-uc.a.run.app
    availability:
      - RUNTIME
  # Backwards compatibility fallback if backend is running on previous service name
  - variable: CAREER_AGENT_API_URL
    value: https://career-agent-iqf6u4g5bq-uc.a.run.app
    availability:
      - RUNTIME
  # Comma-separated beta user emails. Keep this out of Git — inject via the
  # Firebase App Hosting UI or a secret, not committed here.
  - variable: AUTHORIZED_EMAILS
    value: ""
    availability:
      - RUNTIME
  # Only required if the backend enables the optional RUN_AUTH_TOKEN second
  # gate for spending endpoints. Leave blank if the backend does not set it.
  - variable: TALENTOS_RUN_TOKEN
    value: ""
    availability:
      - RUNTIME
