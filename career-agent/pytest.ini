[pytest]
testpaths = tests
# Every test here is offline and hermetic: no Firestore, no model calls, no
# network. That is deliberate -- these must run on a clone with no GCP project
# and no credentials, or they will not be run at all.
addopts = -q --strict-markers
asyncio_mode = auto
markers =
    network: hits a live external API; excluded from the default run
